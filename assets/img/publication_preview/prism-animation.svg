<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700">
  <defs>
    <marker id="arr"      markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#757575"/></marker>
    <marker id="arrP"     markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#9370DB"/></marker>
    <marker id="arrA"     markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#E8A838"/></marker>
    <marker id="arrT"     markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5BA49A"/></marker>
    <marker id="arrB"     markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6B9BD2"/></marker>

    <style>
      .t  { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #333; }
      .ts { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #555; font-weight: 500; }
      .th { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #222; }
      .c-purple > rect { fill: #E8E0F8; stroke: #B8A8E0; }
      .c-purple > .th   { fill: #5B3FA0; }
      .c-purple > .ts   { fill: #7E6BB8; }
      .c-amber > rect  { fill: #FFF3DC; stroke: #E8C878; }
      .c-amber > .th   { fill: #A07010; }
      .c-amber > .ts   { fill: #B8882E; }
      .c-teal > rect   { fill: #D8F0EC; stroke: #88C8B8; }
      .c-teal > .th    { fill: #2A7060; }
      .c-teal > .ts    { fill: #4A9080; }
      .c-blue > rect   { fill: #E0ECF8; stroke: #A0C0E8; }
      .c-blue > .th    { fill: #2A5F90; }
      .c-blue > .ts    { fill: #4A80B0; }
      .c-coral > rect  { fill: #F8E8E0; stroke: #E0B8A0; }
      .c-coral > .th   { fill: #A05030; }
      .c-coral > .ts   { fill: #B87050; }
      .c-gray > rect   { fill: #F0F0F0; stroke: #D0D0D0; }
      .c-gray > .th    { fill: #444; }
      .c-gray > .ts    { fill: #777; }
      .c-pink > rect   { fill: #F8E0F0; stroke: #E0A8D0; }
      .c-pink > .th    { fill: #902060; }
      .c-pink > .ts    { fill: #B04080; }
    </style>
  </defs>

  <rect width="1080" height="700" fill="#FAFAFA"/>

  <!-- ==================== PIPELINE 1 (top-left) ==================== -->
  <g class="c-purple" transform="translate(40,60)">
    <rect width="320" height="226" rx="8"/>
    <rect width="320" height="34" rx="8" fill="#D8D0F0"/>
    <text x="160" y="22" text-anchor="middle" class="th" letter-spacing="0.04em">1 · DEPTH OF ANALYSIS</text>
    <g transform="translate(14,42)">
      <rect width="292" height="36" rx="6" fill="#F4F0FC" stroke="#D8D0F0"/>
      <text x="146" y="15" text-anchor="middle" class="th">Classify ADUs</text>
      <text x="146" y="28" text-anchor="middle" class="ts">Claim vs Premise · Aspect Topic</text>
    </g>
    <line x1="160" y1="82" x2="160" y2="92" stroke="#9E9E9E" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(14,96)">
      <rect width="292" height="48" rx="6" fill="#F4F0FC" stroke="#D8D0F0"/>
      <text x="146" y="15" text-anchor="middle" class="th">Assess Grounding Level g(p)</text>
      <g transform="translate(10,22)">
        <rect width="78" height="18" rx="9" fill="#fff" stroke="#D0D0D0"/>
        <text x="39" y="13" text-anchor="middle" class="ts">L0: Vague</text>
      </g>
      <g transform="translate(107,22)">
        <rect width="80" height="18" rx="9" fill="#fff" stroke="#E8A838"/>
        <text x="40" y="13" text-anchor="middle" fill="#A07010" font-family="system-ui, sans-serif" font-size="11">L1: Internal</text>
      </g>
      <g transform="translate(206,22)">
        <rect width="78" height="18" rx="9" fill="#fff" stroke="#9370DB"/>
        <text x="39" y="13" text-anchor="middle" fill="#5B3FA0" font-family="system-ui, sans-serif" font-size="11">L2: External</text>
      </g>
    </g>
    <line x1="160" y1="148" x2="160" y2="158" stroke="#9E9E9E" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(14,162)">
      <rect width="292" height="42" rx="6" fill="#F4F0FC" stroke="#B8A8E0"/>
      <text x="146" y="16" text-anchor="middle" class="th">Harmonic Mean Score</text>
      <text x="146" y="32" text-anchor="middle" class="ts">DoA = 2·(R_prem · S_depth) / (R_prem + S_depth)</text>
    </g>

  </g>

  <!-- ==================== PIPELINE 2 (top-right) ==================== -->
  <g class="c-amber" transform="translate(710,60)">
    <rect width="320" height="238" rx="8"/>
    <rect width="320" height="34" rx="8" fill="#F0E0C0"/>
    <text x="160" y="22" text-anchor="middle" class="th" letter-spacing="0.04em">2 · NOVELTY ASSESSMENT</text>
    <g transform="translate(14,42)">
      <rect width="292" height="36" rx="6" fill="#FFF8EC" stroke="#F0E0C0"/>
      <text x="146" y="15" text-anchor="middle" class="th">Extract Novelty Claims</text>
      <text x="146" y="28" text-anchor="middle" class="ts">Task · Contribution Anchors · Key Terms</text>
    </g>
    <line x1="160" y1="82" x2="160" y2="92" stroke="#9E9E9E" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(14,96)">
      <rect width="292" height="36" rx="6" fill="#FFF8EC" stroke="#F0E0C0"/>
      <text x="146" y="15" text-anchor="middle" class="th">Semantic Scholar Retrieval</text>
      <text x="146" y="28" text-anchor="middle" class="ts">MMR Diversified Pool B = {b₁...bₖ}</text>
    </g>
    <line x1="160" y1="136" x2="160" y2="146" stroke="#9E9E9E" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(14,150)">
      <rect width="292" height="36" rx="6" fill="#FFF8EC" stroke="#F0E0C0"/>
      <text x="146" y="15" text-anchor="middle" class="th">LLM Judge Verification</text>
      <text x="146" y="28" text-anchor="middle" class="ts">s(cᵢ,bⱼ) ∈ {-2, -1, 0, +1, +2}</text>
    </g>
    <g transform="translate(14,198)">
      <rect width="292" height="20" rx="6" fill="#FFF8EC" stroke="#F0E0C0"/>
      <rect x="8" y="5" width="50" height="10" rx="5" fill="#F0E0C0"/>
      <rect x="64" y="5" width="50" height="10" rx="5" fill="#E8E8E8"/>
      <rect x="120" y="5" width="50" height="10" rx="5" fill="#E8E8E8"/>
      <rect x="176" y="5" width="50" height="10" rx="5" fill="#E8D8B0"/>
      <rect x="232" y="5" width="50" height="10" rx="5" fill="#E8C878"/>
      <text x="33" y="13" text-anchor="middle" fill="#888" font-family="system-ui, sans-serif" font-size="9">-2</text>
      <text x="89" y="13" text-anchor="middle" fill="#888" font-family="system-ui, sans-serif" font-size="9">-1</text>
      <text x="145" y="13" text-anchor="middle" fill="#888" font-family="system-ui, sans-serif" font-size="9">0</text>
      <text x="201" y="13" text-anchor="middle" fill="#888" font-family="system-ui, sans-serif" font-size="9">+1</text>
      <text x="257" y="13" text-anchor="middle" fill="#888" font-family="system-ui, sans-serif" font-size="9">+2</text>
    </g>

  </g>

  <!-- ==================== DATA SOURCE CARD (center, above hub) ==================== -->
  <g transform="translate(370,155)">
    <rect width="320" height="75" rx="10" fill="#fff" stroke="#C0C0C0" stroke-width="1.2"/>
    <text x="160" y="18" text-anchor="middle" fill="#222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.04em">DATA SOURCE</text>
    <text x="160" y="33" text-anchor="middle" fill="#555" font-family="system-ui, sans-serif" font-size="11">1,000 Papers · 200 per venue</text>
    <g transform="translate(32,42)">
      <rect width="90" height="22" rx="4" fill="#F0F0F0" stroke="#D0D0D0"/>
      <text x="45" y="15" text-anchor="middle" fill="#444" font-family="system-ui, sans-serif" font-size="9" font-weight="600">ICLR 24/25/26</text>
      <rect x="96" width="72" height="22" rx="4" fill="#F0F0F0" stroke="#D0D0D0"/>
      <text x="132" y="15" text-anchor="middle" fill="#444" font-family="system-ui, sans-serif" font-size="9" font-weight="600">ICML 2025</text>
      <rect x="174" width="82" height="22" rx="4" fill="#F0F0F0" stroke="#D0D0D0"/>
      <text x="215" y="15" text-anchor="middle" fill="#444" font-family="system-ui, sans-serif" font-size="9" font-weight="600">NeurIPS 2025</text>
    </g>
    <text x="160" y="72" text-anchor="middle" fill="#888" font-family="system-ui, sans-serif" font-size="9">SEA · TreeReview · CycleReviewer · DeepReview · Reviewer2 · Human</text>
  </g>

  <line x1="530" y1="230" x2="530" y2="285" stroke="#9E9E9E" stroke-width="1.5" marker-end="url(#arr)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- ==================== HUB GROUP (center) ==================== -->
  <g transform="translate(370,290)">
    <!-- Outer card -->
    <rect width="320" height="130" rx="10" fill="#fff" stroke="#D0D0D0" stroke-width="1.2"/>

    <!-- Manuscript -->
    <g class="c-gray" transform="translate(10,10)">
      <rect width="120" height="60" rx="8"/>
      <text x="60" y="16" text-anchor="middle" class="ts">MANUSCRIPT</text>
      <rect x="12" y="22" width="96" height="4" rx="2" fill="#e0e0e0"/>
      <rect x="12" y="28" width="78" height="4" rx="2" fill="#e0e0e0"/>
      <rect x="12" y="34" width="88" height="4" rx="2" fill="#e0e0e0"/>
      <rect x="12" y="40" width="66" height="4" rx="2" fill="#e0e0e0"/>
      <text x="60" y="54" text-anchor="middle" class="th" font-size="11">Manuscript</text>
    </g>

    <text x="160" y="48" text-anchor="middle" fill="#aaa" font-family="system-ui, sans-serif" font-size="18" font-weight="300">+</text>

    <!-- Peer Review -->
    <g class="c-pink" transform="translate(190,10)">
      <rect width="120" height="60" rx="8"/>
      <text x="60" y="16" text-anchor="middle" class="ts">PEER REVIEW</text>
      <rect x="12" y="22" width="96" height="4" rx="2" fill="#E8D0E0"/>
      <rect x="12" y="28" width="78" height="4" rx="2" fill="#E8D0E0"/>
      <rect x="12" y="34" width="88" height="4" rx="2" fill="#E8D0E0"/>
      <rect x="12" y="40" width="66" height="4" rx="2" fill="#E8D0E0"/>
      <text x="60" y="54" text-anchor="middle" class="th" font-size="11">Peer Review</text>
    </g>

    <!-- Internal arrow -->
    <line x1="160" y1="75" x2="160" y2="88" stroke="#9E9E9E" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- Data Segmentation -->
    <g class="c-coral" transform="translate(10,92)">
      <rect width="300" height="32" rx="8"/>
      <text x="150" y="14" text-anchor="middle" class="th" letter-spacing="0.04em" font-size="12">DATA SEGMENTATION</text>
      <text x="150" y="26" text-anchor="middle" class="ts" font-size="10">Summary · Strengths · Weaknesses · Questions</text>
    </g>
  </g>

  <!-- ==================== CONNECTORS: Hub Group → Pipelines ==================== -->
  <!-- Hub center-left → P1 bottom-center -->
  <line x1="370" y1="355" x2="200" y2="286" stroke="#9370DB" stroke-width="1.3" marker-end="url(#arrP)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle r="3" fill="#9370DB">
    <animateMotion path="M370,355 L200,286" dur="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Hub center-right → P2 bottom-center -->
  <line x1="690" y1="355" x2="870" y2="298" stroke="#E8A838" stroke-width="1.3" marker-end="url(#arrA)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </line>
  <circle r="3" fill="#E8A838">
    <animateMotion path="M690,355 L870,298" dur="0.8s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Hub center-left → P3 top-center -->
  <line x1="370" y1="355" x2="200" y2="430" stroke="#5BA49A" stroke-width="1.3" marker-end="url(#arrT)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
  </line>
  <circle r="3" fill="#5BA49A">
    <animateMotion path="M370,355 L200,430" dur="0.8s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Hub center-right → P4 top-center -->
  <line x1="690" y1="355" x2="870" y2="430" stroke="#6B9BD2" stroke-width="1.3" marker-end="url(#arrB)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </line>
  <circle r="3" fill="#6B9BD2">
    <animateMotion path="M690,355 L870,430" dur="0.8s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== PIPELINE 3 (bottom-left) ==================== -->
  <g class="c-teal" transform="translate(40,430)">
    <rect width="320" height="250" rx="8"/>
    <rect width="320" height="34" rx="8" fill="#B8E0D8"/>
    <text x="160" y="22" text-anchor="middle" class="th" letter-spacing="0.04em">3 · FLAW IDENTIFICATION &amp; PRIORITY</text>
    <g transform="translate(14,42)">
      <rect width="292" height="36" rx="6" fill="#ECF8F4" stroke="#B8E0D8"/>
      <text x="146" y="15" text-anchor="middle" class="th">Extract Flaw Arguments</text>
      <text x="146" y="28" text-anchor="middle" class="ts">Human + LLM Reviews → Parallel Parse</text>
    </g>
    <line x1="160" y1="82" x2="160" y2="92" stroke="#9E9E9E" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(14,96)">
      <rect width="292" height="48" rx="6" fill="#ECF8F4" stroke="#B8E0D8"/>
      <text x="146" y="15" text-anchor="middle" class="th">Consensus Verification</text>
      <text x="146" y="28" text-anchor="middle" class="ts">LLM Judge → Valid vs Hallucinated</text>
      <g transform="translate(50,34)">
        <rect width="72" height="12" rx="6" fill="#fff" stroke="#E8A838"/>
        <text x="36" y="10" text-anchor="middle" fill="#A07010" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Critical</text>
      </g>
      <g transform="translate(170,34)">
        <rect width="60" height="12" rx="6" fill="#fff" stroke="#B0B0B0"/>
        <text x="30" y="10" text-anchor="middle" fill="#666" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Minor</text>
      </g>
    </g>
    <line x1="160" y1="148" x2="160" y2="158" stroke="#9E9E9E" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(14,162)">
      <rect width="292" height="36" rx="6" fill="#ECF8F4" stroke="#B8E0D8"/>
      <text x="146" y="15" text-anchor="middle" class="th">Positional Recovery → Rank</text>
      <text x="146" y="28" text-anchor="middle" class="ts">Critical flaws should appear first</text>
    </g>
    <g transform="translate(20,212)">
      <g>
        <rect width="180" height="7" rx="3.5" fill="#E8E8E8"/>
        <rect width="155" height="7" rx="3.5" fill="#E8A838">
          <animate attributeName="width" values="0;155" dur="2s" fill="freeze"/>
        </rect>
        <text x="190" y="7" fill="#888" font-family="system-ui, sans-serif" font-size="10">#1 Critical</text>
      </g>
      <g transform="translate(0,12)">
        <rect width="180" height="7" rx="3.5" fill="#E8E8E8"/>
        <rect width="120" height="7" rx="3.5" fill="#E8C878">
          <animate attributeName="width" values="0;120" dur="2s" begin="0.3s" fill="freeze"/>
        </rect>
        <text x="190" y="7" fill="#888" font-family="system-ui, sans-serif" font-size="10">#2 Critical</text>
      </g>
      <g transform="translate(0,24)">
        <rect width="180" height="7" rx="3.5" fill="#E8E8E8"/>
        <rect width="80" height="7" rx="3.5" fill="#B0B0B0">
          <animate attributeName="width" values="0;80" dur="2s" begin="0.6s" fill="freeze"/>
        </rect>
        <text x="190" y="7" fill="#888" font-family="system-ui, sans-serif" font-size="10">#3 Minor</text>
      </g>
    </g>

  </g>

  <!-- ==================== PIPELINE 4 (bottom-right) ==================== -->
  <g class="c-blue" transform="translate(710,430)">
    <rect width="320" height="238" rx="8"/>
    <rect width="320" height="34" rx="8" fill="#C0D8F0"/>
    <text x="160" y="22" text-anchor="middle" class="th" letter-spacing="0.04em">4 · MULTI-DIM CONSTRUCTIVENESS</text>
    <g transform="translate(14,42)">
      <rect width="292" height="32" rx="6" fill="#ECF2FA" stroke="#C0D8F0"/>
      <text x="146" y="14" text-anchor="middle" class="th">Decompose into ARCs</text>
      <text x="146" y="26" text-anchor="middle" class="ts">Atomic Review Comments</text>
    </g>
    <line x1="160" y1="78" x2="160" y2="88" stroke="#9E9E9E" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(14,92)">
      <rect width="292" height="100" rx="6" fill="#ECF2FA" stroke="#C0D8F0"/>
      <text x="146" y="16" text-anchor="middle" class="th">Rate 5 Dimensions (0-2)</text>
      <g transform="translate(12,26)">
        <text x="0" y="9" class="ts">D1 Actionability</text>
        <rect x="100" y="1" width="168" height="8" rx="4" fill="#E8E8E8"/>
        <rect x="100" y="1" width="120" height="8" rx="4" fill="#9370DB">
          <animate attributeName="width" values="0;120" dur="1.2s" fill="freeze"/>
        </rect>
      </g>
      <g transform="translate(12,40)">
        <text x="0" y="9" class="ts">D2 Specificity</text>
        <rect x="100" y="1" width="168" height="8" rx="4" fill="#E8E8E8"/>
        <rect x="100" y="1" width="145" height="8" rx="4" fill="#9370DB">
          <animate attributeName="width" values="0;145" dur="1.2s" begin="0.1s" fill="freeze"/>
        </rect>
      </g>
      <g transform="translate(12,54)">
        <text x="0" y="9" class="ts">D3 Justification</text>
        <rect x="100" y="1" width="168" height="8" rx="4" fill="#E8E8E8"/>
        <rect x="100" y="1" width="95" height="8" rx="4" fill="#E8A838">
          <animate attributeName="width" values="0;95" dur="1.2s" begin="0.2s" fill="freeze"/>
        </rect>
      </g>
      <g transform="translate(12,68)">
        <text x="0" y="9" class="ts">D4 Solution</text>
        <rect x="100" y="1" width="168" height="8" rx="4" fill="#E8E8E8"/>
        <rect x="100" y="1" width="70" height="8" rx="4" fill="#E8A838">
          <animate attributeName="width" values="0;70" dur="1.2s" begin="0.3s" fill="freeze"/>
        </rect>
      </g>
      <g transform="translate(12,82)">
        <text x="0" y="9" class="ts">D5 Tone</text>
        <rect x="100" y="1" width="168" height="8" rx="4" fill="#E8E8E8"/>
        <rect x="100" y="1" width="130" height="8" rx="4" fill="#6B9BD2">
          <animate attributeName="width" values="0;130" dur="1.2s" begin="0.4s" fill="freeze"/>
        </rect>
      </g>
    </g>
    <line x1="160" y1="196" x2="160" y2="206" stroke="#9E9E9E" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(14,210)">
      <rect width="292" height="18" rx="6" fill="#ECF2FA" stroke="#C0D8F0"/>
      <text x="146" y="13" text-anchor="middle" class="ts">MCS = (1/n) Σ CLC(cⱼ) ∈ [0,1]</text>
    </g>

  </g>


</svg>

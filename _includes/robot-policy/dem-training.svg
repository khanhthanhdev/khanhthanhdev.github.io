<svg aria-labelledby="dem-train-title dem-train-desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1610 958"><title id="dem-train-title">DEM training step</title><desc id="dem-train-desc">Real stacking demonstrations with the idle start trimmed give a 16-step action chunk per sample. The chunk is mixed with Gaussian noise at a random time, a Jacobian-vector product through the head gives the MeanFlow target, and an adaptive-weighted squared error plus a dispersive term is the loss. History and camera views can be hidden in a fraction of samples. AdamW with warm-up and cosine decay updates the head and the vision encoder, NeoBERT stays frozen, and an exponential moving average of the weights is what runs on the arm.</desc><defs><marker id="dem-train-ah" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0,1 L10,5 L0,9 z" class="ah"/></marker></defs><rect width="6" height="34" x="40" y="22" class="tick"/><text x="62" y="51" class="H">DEM learns to jump from noise to a demonstrated chunk.</text><g aria-hidden="true"><rect width="14" height="14" x="62" y="76" class="op c-image" rx="2"/><text x="86" y="89" class="C">IMAGE</text><rect width="14" height="14" x="173" y="76" class="op c-text" rx="2"/><text x="197" y="89" class="C">TEXT</text><rect width="14" height="14" x="273" y="76" class="op c-state" rx="2"/><text x="297" y="89" class="C">JOINT STATE</text><rect width="14" height="14" x="447" y="76" class="op c-latent" rx="2"/><text x="471" y="89" class="C">NOISE</text><rect width="14" height="14" x="563" y="76" class="op-a" rx="2"/><text x="587" y="89" class="C">ACTIONS</text></g><g aria-hidden="true"><rect width="121" height="30" x="1449" y="26" class="badge" rx="5"/><text x="1509.5" y="46" class="C" text-anchor="middle">SCHEMATIC</text></g><path marker-end="url(#dem-train-ah)" d="M510 315 H568" class="ln"/><path marker-end="url(#dem-train-ah)" d="M1040 315 H1098" class="ln"/><path marker-end="url(#dem-train-ah)" d="M1335.0 480 V506 H275 V562" class="ln"/><path marker-end="url(#dem-train-ah)" d="M510 729 H568" class="ln"/><path marker-end="url(#dem-train-ah)" d="M1040 729 H1098" class="ln"/><g data-step="t-data"><text x="40" y="136" class="CL">1 · data</text><g><rect width="470" height="330" x="40" y="150" class="sk" rx="10"/></g><text x="62" y="190" class="T">Real demos, idle start cut</text><rect width="60" height="40" x="62" y="214" class="sk f-cell" rx="3"/><text x="92" y="239" class="CLs" text-anchor="middle">IDLE</text><rect width="362" height="40" x="126" y="214" class="op c-image" rx="3"/><text x="307" y="239" class="S" text-anchor="middle">one episode · 20 fps · 3 cameras</text><path d="M112 206 V262" class="ln-t"/><text x="112" y="280" class="Ms" text-anchor="start">cut 3 frames before the first move</text><g class="seq"><rect width="16" height="34" x="182" y="300" class="op-a" rx="1" style="--j:0"/><rect width="16" height="34" x="201" y="300" class="op-a" rx="1" style="--j:4"/><rect width="16" height="34" x="220" y="300" class="op-a" rx="1" style="--j:8"/><rect width="16" height="34" x="239" y="300" class="op-a" rx="1" style="--j:12"/><rect width="16" height="34" x="258" y="300" class="op-a" rx="1" style="--j:16"/><rect width="16" height="34" x="277" y="300" class="op-a" rx="1" style="--j:20"/><rect width="16" height="34" x="296" y="300" class="op-a" rx="1" style="--j:24"/><rect width="16" height="34" x="315" y="300" class="op-a" rx="1" style="--j:28"/><rect width="16" height="34" x="334" y="300" class="op-a" rx="1" style="--j:32"/><rect width="16" height="34" x="353" y="300" class="op-a" rx="1" style="--j:36"/><rect width="16" height="34" x="372" y="300" class="op-a" rx="1" style="--j:40"/><rect width="16" height="34" x="391" y="300" class="op-a" rx="1" style="--j:44"/><rect width="16" height="34" x="410" y="300" class="op-a" rx="1" style="--j:48"/><rect width="16" height="34" x="429" y="300" class="op-a" rx="1" style="--j:52"/><rect width="16" height="34" x="448" y="300" class="op-a" rx="1" style="--j:56"/><rect width="16" height="34" x="467" y="300" class="op-a" rx="1" style="--j:60"/></g><rect width="40" height="34" x="126" y="300" class="op op-b c-image" rx="3"/><text x="146" y="350" class="Ms" text-anchor="middle">o</text><text x="332" y="356" class="Ms" text-anchor="middle">next 16 actions</text><text x="62" y="458" class="M">147 train · 17 held out · 32,016 frames</text></g><g data-step="t-noise"><text x="570" y="136" class="CL">2 · noise and time</text><g><rect width="470" height="330" x="570" y="150" class="sk" rx="10"/></g><text x="592" y="190" class="T">Mix the chunk with noise</text><rect width="56" height="48" x="592" y="256" class="op-a" rx="3"/><text x="620" y="285" class="S" text-anchor="middle">x</text><rect width="56" height="48" x="962" y="256" class="op c-latent" rx="3"/><text x="990" y="285" class="S" text-anchor="middle">ε</text><path d="M652 280 H958" class="axis"/><circle cx="872.3" cy="280" r="7" class="op c-latent"/><circle cx="759.1" cy="280" r="5" class="op"/><text x="872.3" y="264" class="Ms" text-anchor="middle">z_t</text><text x="759.1" y="304" class="Ms" text-anchor="middle">r</text><text x="872.3" y="304" class="Ms" text-anchor="middle">t</text><text x="655" y="324" class="Ms">t = 0 · data</text><text x="955" y="324" class="Ms" text-anchor="end">t = 1 · noise</text><text x="592" y="386" class="S">z_t = (1 − t) x + t ε</text><text x="832" y="386" class="S">v = ε − x</text><text x="592" y="458" class="M">logit-normal (−0.4, 1) · r = t in 50 %</text></g><g data-step="t-target"><text x="1100" y="136" class="CL">3 · MeanFlow target</text><g><rect width="470" height="330" x="1100" y="150" class="sk" rx="10"/></g><text x="1122" y="190" class="T">The head sets its own target</text><rect width="200" height="52" x="1122" y="212" class="op" rx="4"/><text x="1222" y="244" class="S" text-anchor="middle">u_θ(z_t, r, t | C)</text><path marker-end="url(#dem-train-ah)" d="M1322 238 L1358 238" class="ln-t"/><rect width="186" height="52" x="1362" y="212" class="op" rx="4"/><text x="1455" y="236" class="S" text-anchor="middle">jvp along</text><text x="1455" y="254" class="Ms" text-anchor="middle">(v, 0, 1)</text><path marker-end="url(#dem-train-ah)" d="M1455 268 L1455 298" class="ln-t"/><rect width="306" height="52" x="1242" y="300" class="op op-b" rx="4"/><text x="1395" y="332" class="S" text-anchor="middle">u_tgt = sg(v − (t − r) du/dt)</text><path marker-end="url(#dem-train-ah)" d="M1222 268 L1222 386" class="ln-t"/><text x="1234" y="396" class="S" text-anchor="start">u vs u_tgt</text><text x="1122" y="458" class="M">torch.func.jvp · head and loss in fp32</text></g><g data-step="t-loss"><text x="40" y="550" class="CL">4 · loss</text><g><rect width="470" height="330" x="40" y="564" class="sk" rx="10"/></g><text x="62" y="604" class="T">Adaptive weight + dispersion</text><rect width="18" height="36" x="62" y="688" class="op" rx="1"/><rect width="18" height="54.9" x="62" y="732" class="op-a" rx="1"/><rect width="18" height="48" x="88" y="676" class="op" rx="1"/><rect width="18" height="46.4" x="88" y="732" class="op-a" rx="1"/><rect width="18" height="92" x="114" y="632" class="op" rx="1"/><rect width="18" height="36.5" x="114" y="732" class="op-a" rx="1"/><rect width="18" height="32" x="140" y="692" class="op" rx="1"/><rect width="18" height="60.2" x="140" y="732" class="op-a" rx="1"/><rect width="18" height="60" x="166" y="664" class="op" rx="1"/><rect width="18" height="42.1" x="166" y="732" class="op-a" rx="1"/><rect width="18" height="44" x="192" y="680" class="op" rx="1"/><rect width="18" height="48.5" x="192" y="732" class="op-a" rx="1"/><rect width="18" height="40" x="218" y="684" class="op" rx="1"/><rect width="18" height="51.2" x="218" y="732" class="op-a" rx="1"/><rect width="18" height="76" x="244" y="648" class="op" rx="1"/><rect width="18" height="38.7" x="244" y="732" class="op-a" rx="1"/><text x="62" y="816" class="Ms">δ per sample (top) · weight w (bottom)</text><circle cx="370" cy="674" r="6" class="op c-latent"/><circle cx="420" cy="654" r="6" class="op c-latent"/><circle cx="450" cy="704" r="6" class="op c-latent"/><circle cx="390" cy="734" r="6" class="op c-latent"/><circle cx="435" cy="759" r="6" class="op c-latent"/><circle cx="470" cy="674" r="6" class="op c-latent"/><text x="427" y="792" class="Ms" text-anchor="middle">spread apart</text><text x="62" y="872" class="M">w = 1/√(δ + 1e-3) · + 0.25 L_disp</text></g><g data-step="t-masks"><text x="570" y="550" class="CL">5 · masking</text><g><rect width="470" height="330" x="570" y="564" class="sk" rx="10"/></g><text x="592" y="604" class="T">Hide history and views</text><rect width="18" height="34" x="592" y="628" class="sk f-cell" rx="1"/><rect width="18" height="34" x="614" y="628" class="sk f-cell" rx="1"/><rect width="18" height="34" x="636" y="628" class="sk f-cell" rx="1"/><rect width="18" height="34" x="658" y="628" class="sk f-cell" rx="1"/><rect width="18" height="34" x="680" y="628" class="sk f-cell" rx="1"/><rect width="18" height="34" x="702" y="628" class="sk f-cell" rx="1"/><rect width="18" height="34" x="724" y="628" class="sk f-cell" rx="1"/><rect width="18" height="34" x="746" y="628" class="sk f-cell" rx="1"/><rect width="18" height="34" x="768" y="628" class="sk f-cell" rx="1"/><rect width="18" height="34" x="790" y="628" class="sk f-cell" rx="1"/><text x="592" y="682" class="Ms">10 s of history · all hidden in 20 % of samples</text><rect width="128" height="70" x="592" y="698" class="sk f-cell" rx="4"/><text x="656" y="738" class="CLs" text-anchor="middle">FRONT</text><rect width="128" height="70" x="732" y="698" class="op c-image" rx="4"/><text x="796" y="738" class="CLs" text-anchor="middle">WRIST</text><rect width="128" height="70" x="872" y="698" class="sk f-cell" rx="4"/><text x="936" y="738" class="CLs" text-anchor="middle">TOP</text><text x="592" y="794" class="Ms">front and top each hid
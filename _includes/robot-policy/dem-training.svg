<svg viewBox="0 0 1610 958" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dem-train-title dem-train-desc">
  <title id="dem-train-title">DEM training step</title>
  <desc id="dem-train-desc">Real stacking demonstrations with the idle start trimmed give a 16-step action chunk per sample. The chunk is mixed with Gaussian noise at a random time, a Jacobian-vector product through the head gives the MeanFlow target, and an adaptive-weighted squared error plus a dispersive term is the loss. History and camera views can be hidden in a fraction of samples. AdamW with warm-up and cosine decay updates the head and the vision encoder, NeoBERT stays frozen, and an exponential moving average of the weights is what runs on the arm.</desc>
  <defs>
    <marker id="dem-train-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="ah" d="M0,1 L10,5 L0,9 z" />
    </marker>
  </defs>
  <rect class="tick" x="40" y="22" width="6" height="34" />
  <text class="H" x="62" y="51">DEM learns to jump from noise to a demonstrated chunk.</text>
  <g aria-hidden="true">
    <rect class="op c-image" x="62" y="76" width="14" height="14" rx="2" />
    <text class="C" x="86" y="89">IMAGE</text>
    <rect class="op c-text" x="173" y="76" width="14" height="14" rx="2" />
    <text class="C" x="197" y="89">TEXT</text>
    <rect class="op c-state" x="273" y="76" width="14" height="14" rx="2" />
    <text class="C" x="297" y="89">JOINT STATE</text>
    <rect class="op c-latent" x="447" y="76" width="14" height="14" rx="2" />
    <text class="C" x="471" y="89">NOISE</text>
    <rect class="op-a" x="563" y="76" width="14" height="14" rx="2" />
    <text class="C" x="587" y="89">ACTIONS</text>
  </g>
  <g aria-hidden="true">
    <rect class="badge" x="1449" y="26" width="121" height="30" rx="5" />
    <text class="C" x="1509.5" y="46" text-anchor="middle">SCHEMATIC</text>
  </g>

  <path class="ln" d="M510 315 H568" marker-end="url(#dem-train-ah)" />
  <path class="ln" d="M1040 315 H1098" marker-end="url(#dem-train-ah)" />
  <path class="ln" d="M1335.0 480 V506 H275 V562" marker-end="url(#dem-train-ah)" />
  <path class="ln" d="M510 729 H568" marker-end="url(#dem-train-ah)" />
  <path class="ln" d="M1040 729 H1098" marker-end="url(#dem-train-ah)" />

  <g data-step="t-data">
    <text class="CL" x="40" y="136">1 · data</text>
    <g>
      <rect class="sk" x="40" y="150" width="470" height="330" rx="10" />
    </g>
    <text class="T" x="62" y="190">Real demos, idle start cut</text>
    <rect class="sk f-cell" x="62" y="214" width="60" height="40" rx="3" />
    <text class="CLs" x="92" y="239" text-anchor="middle">IDLE</text>
    <rect class="op c-image" x="126" y="214" width="362" height="40" rx="3" />
    <text class="S" x="307" y="239" text-anchor="middle">one episode · 20 fps · 3 cameras</text>
    <path class="ln-t" d="M112 206 V262" />
    <text class="Ms" x="112" y="280" text-anchor="start">cut 3 frames before the first move</text>
    <g class="seq">
      <rect class="op-a" x="182" y="300" width="16" height="34" rx="1" style="--j:0" />
      <rect class="op-a" x="201" y="300" width="16" height="34" rx="1" style="--j:4" />
      <rect class="op-a" x="220" y="300" width="16" height="34" rx="1" style="--j:8" />
      <rect class="op-a" x="239" y="300" width="16" height="34" rx="1" style="--j:12" />
      <rect class="op-a" x="258" y="300" width="16" height="34" rx="1" style="--j:16" />
      <rect class="op-a" x="277" y="300" width="16" height="34" rx="1" style="--j:20" />
      <rect class="op-a" x="296" y="300" width="16" height="34" rx="1" style="--j:24" />
      <rect class="op-a" x="315" y="300" width="16" height="34" rx="1" style="--j:28" />
      <rect class="op-a" x="334" y="300" width="16" height="34" rx="1" style="--j:32" />
      <rect class="op-a" x="353" y="300" width="16" height="34" rx="1" style="--j:36" />
      <rect class="op-a" x="372" y="300" width="16" height="34" rx="1" style="--j:40" />
      <rect class="op-a" x="391" y="300" width="16" height="34" rx="1" style="--j:44" />
      <rect class="op-a" x="410" y="300" width="16" height="34" rx="1" style="--j:48" />
      <rect class="op-a" x="429" y="300" width="16" height="34" rx="1" style="--j:52" />
      <rect class="op-a" x="448" y="300" width="16" height="34" rx="1" style="--j:56" />
      <rect class="op-a" x="467" y="300" width="16" height="34" rx="1" style="--j:60" />
    </g>
    <rect class="op op-b c-image" x="126" y="300" width="40" height="34" rx="3" />
    <text class="Ms" x="146" y="350" text-anchor="middle">o</text>
    <text class="Ms" x="332" y="356" text-anchor="middle">next 16 actions</text>
    <text class="M" x="62" y="458">147 train · 17 held out · 32,016 frames</text>
  </g>
  <g data-step="t-noise">
    <text class="CL" x="570" y="136">2 · noise and time</text>
    <g>
      <rect class="sk" x="570" y="150" width="470" height="330" rx="10" />
    </g>
    <text class="T" x="592" y="190">Mix the chunk with noise</text>
    <rect class="op-a" x="592" y="256" width="56" height="48" rx="3" />
    <text class="S" x="620" y="285" text-anchor="middle">x</text>
    <rect class="op c-latent" x="962" y="256" width="56" height="48" rx="3" />
    <text class="S" x="990" y="285" text-anchor="middle">ε</text>
    <path class="axis" d="M652 280 H958" />
    <circle class="op c-latent" cx="872.3" cy="280" r="7" />
    <circle class="op" cx="759.1" cy="280" r="5" />
    <text class="Ms" x="872.3" y="264" text-anchor="middle">z_t</text>
    <text class="Ms" x="759.1" y="304" text-anchor="middle">r</text>
    <text class="Ms" x="872.3" y="304" text-anchor="middle">t</text>
    <text class="Ms" x="655" y="324">t = 0 · data</text>
    <text class="Ms" x="955" y="324" text-anchor="end">t = 1 · noise</text>
    <text class="S" x="592" y="386">z_t = (1 − t) x + t ε</text>
    <text class="S" x="832" y="386">v = ε − x</text>
    <text class="M" x="592" y="458">logit-normal (−0.4, 1) · r = t in 50 %</text>
  </g>
  <g data-step="t-target">
    <text class="CL" x="1100" y="136">3 · MeanFlow target</text>
    <g>
      <rect class="sk" x="1100" y="150" width="470" height="330" rx="10" />
    </g>
    <text class="T" x="1122" y="190">The head sets its own target</text>
    <rect class="op" x="1122" y="212" width="200" height="52" rx="4" />
    <text class="S" x="1222" y="244" text-anchor="middle">u_θ(z_t, r, t | C)</text>
    <path class="ln-t" d="M1322 238 L1358 238" marker-end="url(#dem-train-ah)" />
    <rect class="op" x="1362" y="212" width="186" height="52" rx="4" />
    <text class="S" x="1455" y="236" text-anchor="middle">jvp along</text>
    <text class="Ms" x="1455" y="254" text-anchor="middle">(v, 0, 1)</text>
    <path class="ln-t" d="M1455 268 L1455 298" marker-end="url(#dem-train-ah)" />
    <rect class="op op-b" x="1242" y="300" width="306" height="52" rx="4" />
    <text class="S" x="1395" y="332" text-anchor="middle">u_tgt = sg(v − (t − r) du/dt)</text>
    <path class="ln-t" d="M1222 268 L1222 386" marker-end="url(#dem-train-ah)" />
    <text class="S" x="1234" y="396" text-anchor="start">u   vs   u_tgt</text>
    <text class="M" x="1122" y="458">torch.func.jvp · head and loss in fp32</text>
  </g>
  <g data-step="t-loss">
    <text class="CL" x="40" y="550">4 · loss</text>
    <g>
      <rect class="sk" x="40" y="564" width="470" height="330" rx="10" />
    </g>
    <text class="T" x="62" y="604">Adaptive weight + dispersion</text>
    <rect class="op" x="62" y="688" width="18" height="36" rx="1" />
    <rect class="op-a" x="62" y="732" width="18" height="54.9" rx="1" />
    <rect class="op" x="88" y="676" width="18" height="48" rx="1" />
    <rect class="op-a" x="88" y="732" width="18" height="46.4" rx="1" />
    <rect class="op" x="114" y="632" width="18" height="92" rx="1" />
    <rect class="op-a" x="114" y="732" width="18" height="36.5" rx="1" />
    <rect class="op" x="140" y="692" width="18" height="32" rx="1" />
    <rect class="op-a" x="140" y="732" width="18" height="60.2" rx="1" />
    <rect class="op" x="166" y="664" width="18" height="60" rx="1" />
    <rect class="op-a" x="166" y="732" width="18" height="42.1" rx="1" />
    <rect class="op" x="192" y="680" width="18" height="44" rx="1" />
    <rect class="op-a" x="192" y="732" width="18" height="48.5" rx="1" />
    <rect class="op" x="218" y="684" width="18" height="40" rx="1" />
    <rect class="op-a" x="218" y="732" width="18" height="51.2" rx="1" />
    <rect class="op" x="244" y="648" width="18" height="76" rx="1" />
    <rect class="op-a" x="244" y="732" width="18" height="38.7" rx="1" />
    <text class="Ms" x="62" y="816">δ per sample (top) · weight w (bottom)</text>
    <circle class="op c-latent" cx="370" cy="674" r="6" />
    <circle class="op c-latent" cx="420" cy="654" r="6" />
    <circle class="op c-latent" cx="450" cy="704" r="6" />
    <circle class="op c-latent" cx="390" cy="734" r="6" />
    <circle class="op c-latent" cx="435" cy="759" r="6" />
    <circle class="op c-latent" cx="470" cy="674" r="6" />
    <text class="Ms" x="427" y="792" text-anchor="middle">spread apart</text>
    <text class="M" x="62" y="872">w = 1/√(δ + 1e-3) · + 0.25 L_disp</text>
  </g>
  <g data-step="t-masks">
    <text class="CL" x="570" y="550">5 · masking</text>
    <g>
      <rect class="sk" x="570" y="564" width="470" height="330" rx="10" />
    </g>
    <text class="T" x="592" y="604">Hide history and views</text>
    <rect class="sk f-cell" x="592" y="628" width="18" height="34" rx="1" />
    <rect class="sk f-cell" x="614" y="628" width="18" height="34" rx="1" />

    <rect class="sk f-cell" x="746" y="628" width="18" height="34" rx="1" />
    <rect class="sk f-cell" x="768" y="628" width="18" height="34" rx="1" />
    <rect class="sk f-cell" x="790" y="628" width="18" height="34" rx="1" />
    <text class="Ms" x="592" y="682">10 s of history · all hidden in 20 % of samples</text>
    <rect class="sk f-cell" x="592" y="698" width="128" height="70" rx="4" />
    <text class="CLs" x="656" y="738" text-anchor="middle">FRONT</text>
    <rect class="op c-image" x="732" y="698" width="128" height="70" rx="4" />
    <text class="CLs" x="796" y="738" text-anchor="middle">WRIST</text>
    <rect class="sk f-cell" x="872" y="698" width="128" height="70" rx="4" />
    <text class="CLs" x="936" y="738" text-anchor="middle">TOP</text>
    <text class="Ms" x="592" y="794">front and top each hidden in 30 % of samples</text>
    <text class="M" x="592" y="872">optional · needs global conditioning</text>
  </g>
  <g data-step="t-update">
    <text class="CL" x="1100" y="550">6 · optimizer and EMA</text>
    <g>
      <rect class="sk" x="1100" y="564" width="470" height="330" rx="10" />
    </g>
    <text class="T" x="1122" y="604">Warm up, decay, average</text>
    <rect class="op" x="1122" y="626" width="128" height="42" rx="4" />
